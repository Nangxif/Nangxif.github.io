<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nangxif</title>
    <meta name="description" content="Nangxif 的个人主页正在开发中" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1c2429;
        --muted: #5a6a73;
        --surface: #e6eef2;
        --accent: #1f7a6c;
        --glow: #7eb8c9;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "DM Sans", sans-serif;
        color: var(--ink);
        background: var(--surface);
        overflow: hidden;
      }

      .scene {
        position: relative;
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 2rem;
        isolation: isolate;
      }

      .scene::before {
        content: "";
        position: absolute;
        inset: -20%;
        z-index: -2;
        background:
          radial-gradient(ellipse 60% 50% at 18% 22%, rgba(126, 184, 201, 0.45), transparent 55%),
          radial-gradient(ellipse 55% 45% at 82% 78%, rgba(31, 122, 108, 0.28), transparent 50%),
          radial-gradient(ellipse 40% 35% at 70% 18%, rgba(255, 255, 255, 0.55), transparent 60%),
          linear-gradient(160deg, #d9e6ec 0%, #e6eef2 45%, #cfdce3 100%);
        animation: drift 18s ease-in-out infinite alternate;
      }

      .scene::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.35;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 180px;
        mix-blend-mode: soft-light;
        pointer-events: none;
      }

      .content {
        text-align: center;
        max-width: 28rem;
        animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .brand {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(3.5rem, 12vw, 6.5rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 0.95;
        color: var(--ink);
      }

      .brand em {
        font-style: italic;
        color: var(--accent);
      }

      .status {
        margin-top: 1.35rem;
        font-size: clamp(1rem, 2.8vw, 1.15rem);
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--muted);
        animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
      }

      .pulse {
        display: inline-block;
        width: 0.45rem;
        height: 0.45rem;
        margin-right: 0.55rem;
        border-radius: 50%;
        background: var(--accent);
        vertical-align: 0.1em;
        animation: pulse 2.2s ease-in-out infinite;
      }

      @keyframes drift {
        from {
          transform: translate3d(-1.5%, -1%, 0) scale(1);
        }
        to {
          transform: translate3d(2%, 1.5%, 0) scale(1.05);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(1.25rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .scene::before,
        .content,
        .status,
        .pulse {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="content">
        <h1 class="brand">Nangxif</h1>
        <p class="status"><span class="pulse" aria-hidden="true"></span>个人主页正在开发中</p>
      </div>
    </main>
  </body>
</html>
